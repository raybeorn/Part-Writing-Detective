<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="Part-Writing Detective logo: a magnifying glass catching parallel fifths on a staff">
  <defs>
    <clipPath id="lens"><circle cx="78" cy="82" r="47"/></clipPath>
  </defs>
  <rect width="180" height="180" rx="28" fill="#1d1f27"/>
  <!-- Lens with a staff behind it -->
  <circle cx="78" cy="82" r="47" fill="#f8f8f2"/>
  <g clip-path="url(#lens)" stroke="#1b1b17" stroke-width="1.6">
    <line x1="20" y1="64" x2="140" y2="64"/>
    <line x1="20" y1="74" x2="140" y2="74"/>
    <line x1="20" y1="84" x2="140" y2="84"/>
    <line x1="20" y1="94" x2="140" y2="94"/>
    <line x1="20" y1="104" x2="140" y2="104"/>
  </g>
  <!-- Two voices in parallel perfect fifths on a treble staff: E5 over A4, then G5 over C5 -->
  <g fill="#1b1b17">
    <ellipse cx="58" cy="69" rx="6.5" ry="5" transform="rotate(-20 58 69)"/>
    <ellipse cx="98" cy="59" rx="6.5" ry="5" transform="rotate(-20 98 59)"/>
    <ellipse cx="58" cy="89" rx="6.5" ry="5" transform="rotate(-20 58 89)"/>
    <ellipse cx="98" cy="79" rx="6.5" ry="5" transform="rotate(-20 98 79)"/>
  </g>
  <!-- Red-pen marks on the parallel fifths -->
  <g stroke="#e05a5a" stroke-width="3" stroke-linecap="round">
    <line x1="66" y1="67" x2="90" y2="61"/>
    <line x1="66" y1="87" x2="90" y2="81"/>
  </g>
  <!-- Rim and handle of the magnifying glass -->
  <circle cx="78" cy="82" r="47" fill="none" stroke="#e0a54a" stroke-width="9"/>
  <line x1="113" y1="117" x2="154" y2="158" stroke="#e0a54a" stroke-width="15" stroke-linecap="round"/>
</svg>
